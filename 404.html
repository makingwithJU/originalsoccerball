<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 | ページが見つかりません</title>
    <meta name="robots" content="noindex,follow" />
    <link rel="canonical" href="https://originalsoccerball.com/" />
    <style>
      :root { color-scheme: light dark; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans JP", sans-serif;
        display: grid;
        place-items: center;
        background: #0b0b0b;
        color: #f3f3f3;
      }
      .card {
        width: min(720px, calc(100% - 32px));
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 16px;
        padding: 20px 18px;
        background: rgba(255,255,255,.06);
        backdrop-filter: blur(10px);
      }
      h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: .02em; }
      p { margin: 0 0 14px; opacity: .92; line-height: 1.6; }
      .actions { display: flex; gap: 10px; flex-wrap: wrap; }
      a {
        color: inherit;
        text-decoration: none;
        border: 1px solid rgba(255,255,255,.18);
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(0,0,0,.22);
      }
      a:hover { background: rgba(255,255,255,.10); }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <h1>404 | ページが見つかりません</h1>
      <p>お探しのURLは移動・削除された可能性があります。トップページから目的のコンテンツを探してください。</p>
      <div class="actions">
        <a href="/">トップへ戻る</a>
        <a href="/#works">Works へ</a>
        <a href="/#order">Order へ</a>
      </div>
      <p style="margin-top:14px;opacity:.7">
        Requested: <code id="p"></code>
      </p>
    </main>
    <script>
      (function () {
        var el = document.getElementById("p");
        if (el) el.textContent = location.pathname + location.search + location.hash;
      })();
    </script>
  </body>
</html>
